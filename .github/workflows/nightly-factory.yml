name: Factory CPU smoke (opt-in)

# Legacy Factory integration repair: #297, #242, epic #212.
# Manual only: optional torch/training must never enter the base PR gate.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: factory-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: optional micro Factory trial
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install optional CPU module
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,neural]"

      - name: Freeze corpus, baseline, controlled siblings and paired comparison
        run: python .github/scripts/run_factory_smoke.py --output factory-smoke

      - name: Resume, budget, immutable corpus and sealed-split regressions
        # Explicit nodes avoid wildcard collection of unrelated optional modules.
        # A missing dependency/CLI in the preceding step fails; it cannot skip.
        run: |
          timeout 90s python -m pytest -q --durations=10 \
            tests/test_factory_smoke_contract.py \
            tests/test_model_factory_resume.py::test_resume_matches_uninterrupted_training \
            tests/test_model_factory_budget.py::test_over_budget_run_requests_stop_as_soon_as_the_full_run_projection_overruns \
            tests/test_model_factory_budget.py::test_budget_exceeded_checkpoint_is_valid_and_loadable \
            tests/test_model_factory_budget.py::test_budget_exceeded_experiment_is_never_eligible_for_promotion \
            tests/test_model_factory_corpus.py::test_resolve_refuses_a_missing_frozen_session_and_names_it \
            tests/test_model_factory_confirmation.py::test_no_search_step_ever_opens_the_sealed_test_partition

      - name: Upload synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-smoke-synthetic-evidence
          path: |
            factory-smoke/smoke-summary.json
            factory-smoke/*.log
            factory-smoke/runs/**/trial_spec.json
            factory-smoke/runs/**/contracts.json
            factory-smoke/runs/**/lineage.json
            factory-smoke/runs/**/execution.json
            factory-smoke/runs/**/metrics/**
            factory-smoke/runs/**/experiment_report.json
            factory-smoke/corpora/**/corpus_manifest.json
            factory-smoke/corpora/**/quality_report.json
            factory-smoke/corpora/**/split_overlap_report.json
          if-no-files-found: error
          retention-days: 7
