name: Nightly Model Factory smoke

# A micro end-to-end factory trial (issue #242, epic #212).
#
# Unit tests prove each component in isolation. This job exists to catch the
# integration rot they cannot see: a corpus that no longer freezes, a resume
# that stopped being exact, a budget that stopped firing, a search that
# started touching the sealed split. It is deliberately tiny — a handful of
# short episodes and a minimal model — so it stays a smoke test, not a
# training run.

on:
  schedule:
    - cron: '0 4 * * *'   # 04:00 UTC daily
  workflow_dispatch:

concurrency:
  group: nightly-factory
  cancel-in-progress: true

jobs:
  smoke:
    name: micro end-to-end trial
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install CPU torch
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install project
        run: python -m pip install -e ".[dev,neural]"

      - name: Detect factory CLI
        id: detect
        run: |
          if ccr factory --help > /dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "`ccr factory` not implemented yet — skipping (issue #228)."
          fi

      # MF-A5 (#217): a corpus must freeze session content hashes, and a
      # controlled trial must then fail rather than re-record a missing one.
      - name: Build a micro corpus
        if: steps.detect.outputs.present == 'true'
        run: |
          ccr factory corpus build .github/fixtures/micro-corpus.yaml \
            --log-format json

      # MF-C3 (#225): fresh baseline, then two siblings differing in exactly
      # one declared field, then a paired comparison.
      - name: Baseline + controlled A/B siblings
        if: steps.detect.outputs.present == 'true'
        run: |
          ccr factory baseline .github/fixtures/micro-baseline.yaml
          ccr factory clone micro-baseline-0001 --set training.closed_loop_pixel_loss_weight=0.125
          ccr factory clone micro-baseline-0001 --set training.closed_loop_pixel_loss_weight=0.500
          ccr factory compare micro-baseline-0001 micro-baseline-0002 micro-baseline-0003

      # MF-B3 (#220): 3 + 3 epochs must equal 6 epochs. This is the property
      # most likely to regress when an unrelated RNG consumer is added to the
      # trainer, and it is invisible to every other test.
      - name: Resume equivalence
        if: steps.detect.outputs.present == 'true'
        run: python -m pytest tests/test_model_factory_resume.py -q

      # MF-B4 (#221): an over-budget run must stop at a checkpoint boundary,
      # write a loadable last.pt, and be refused by promotion.
      - name: Budget enforcement
        if: steps.detect.outputs.present == 'true'
        run: python -m pytest tests/test_model_factory_budget.py -q

      # MF-C5 (#227): turn "routine search never queries the sealed split"
      # from a code-review convention into a mechanically enforced property.
      - name: Sealed-split enforcement
        if: steps.detect.outputs.present == 'true'
        run: python -m pytest tests -q -k sealed_split

      - name: Upload run artifacts
        if: always() && steps.detect.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: factory-smoke-artifacts
          path: |
            runs/**/trial_spec.json
            runs/**/contracts.json
            runs/**/lineage.json
            runs/**/execution.json
            runs/**/metrics/**
            runs/**/experiment_report.json
            corpora/**/corpus_manifest.json
          if-no-files-found: warn
          retention-days: 14
