name: CI

# Tiered CI (issue #242). Timings below were measured on a 4-vCPU CPU-only
# container; runner hardware will shift them, but the ratios hold.
#
#   core              torch-free unit tests, ~2 min, every PR
#   factory-contracts torch-free Model Factory invariants, ~1 min, every PR
#   acceptance        the four slow convergence tests, ~5.5 min, every PR
#   neural            full suite with CPU torch, 20+ min, every PR, non-blocking
#
# The nightly end-to-end factory smoke trial lives in nightly-factory.yml.

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'notebooks/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'notebooks/**']
  workflow_dispatch:

# A 20-minute tier must not queue behind superseded pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # `namesgenerator` (a core dependency) ships an sdist with no wheel, and
  # building it against an old/patched setuptools fails with
  # `AttributeError: install_layout`. Every install job upgrades the build
  # frontend first rather than trusting the runner image's default.
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  # --------------------------------------------------------------- tier 1
  core:
    name: core (no torch, py3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (core + dev only, deliberately without torch)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      # `ccr nursery list` is deliberately NOT smoke-tested here: it exits 1
      # without torch by design (cli.py:1112). The guard is graceful and
      # intentional, so a core-only install genuinely cannot list scenarios.
      # `ccr nursery --help` still exercises the nested subparser wiring
      # because argparse renders help without dispatching to the command.
      - name: CLI smoke
        run: |
          python -c "import cognitive_runtime.cli"
          ccr --help > /dev/null
          ccr nursery --help > /dev/null
          ccr trace list > /dev/null

      # Regression guard for issue #241. `motor/__init__.py` currently imports
      # `motor.cortex_mpc`, which imports torch at module scope, so collection
      # is interrupted with 5 errors and zero tests run in a core-only install.
      # TODO: drop `continue-on-error` the moment #241 lands — at that point
      # this step is the guard that stops it regressing.
      - name: Test collection must succeed without torch (#241)
        continue-on-error: true
        run: python -m pytest tests -q --collect-only

      # The five --ignore'd modules are the #241 collection casualties; drop
      # them from this list when #241 lands.
      #
      # The four --deselect'ed tests are training-convergence acceptance
      # tests, not unit tests. Measured, they are 329s of the suite's 459s --
      # 72% of the runtime in 4 tests. Splitting them into their own job
      # takes this tier from ~7m40s to ~2m10s while still running them on
      # every PR, just in parallel rather than in series.
      #
      # The last --deselect'ed test is the other #241 casualty: it imports
      # `motor.organism_policy` inside the test body, so it fails at runtime
      # rather than at collection. Re-enable it together with #241 -- it is a
      # real test of live stimulus refresh, not a flake.
      #
      # TODO: replace these paths with a `@pytest.mark.acceptance` marker and
      # `-m "not acceptance"`; a path list silently stops working the moment
      # a test is renamed.
      - name: Torch-free unit tests
        run: |
          python -m pytest tests -q \
            --ignore=tests/test_development_ladder.py \
            --ignore=tests/test_efference_record.py \
            --ignore=tests/test_prediction_export.py \
            --ignore=tests/test_reflexes.py \
            --ignore=tests/test_voluntary_motor.py \
            --deselect "tests/test_training.py::test_latent_bc_matches_or_beats_handcrafted_and_beats_random" \
            --deselect "tests/test_training.py::test_learned_policy_outperforms_random_baseline" \
            --deselect "tests/test_training.py::test_bc_learns_to_imitate_scripted_policy" \
            --deselect "tests/test_online_q_acceptance.py::test_simulated_online_q_beats_random_reproducibly" \
            --deselect "tests/test_runtime.py::test_runtime_refreshes_motor_policy_stimuli_before_every_decision"

  # --------------------------------------------------------------- tier 2
  acceptance:
    name: convergence acceptance tests (no torch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (core + dev only)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      # These assert that learning actually converges, so they are worth
      # keeping on every PR -- just not in the critical path of the fast tier.
      #
      # Deliberately split into a blocking step and an allowed-to-fail one.
      # Folding all four into one continue-on-error step would leave these
      # three unguarded: `core` deselects them and `neural` installs torch, so
      # a regression that only manifests torch-free -- one of them acquiring a
      # torch import, say -- would leave every job green.
      - name: Acceptance tests (blocking)
        run: |
          python -m pytest -q --durations=10 \
            "tests/test_training.py::test_latent_bc_matches_or_beats_handcrafted_and_beats_random" \
            "tests/test_training.py::test_learned_policy_outperforms_random_baseline" \
            "tests/test_training.py::test_bc_learns_to_imitate_scripted_policy"

      # This one fails today for TWO independent reasons:
      #   #241 — torch-free, it reaches `motor.cortex_mpc` through
      #          `motor/__init__.py` at runtime (not at collection);
      #   #244 — with torch, a stale golden: training_ticks 15157 -> 13318.
      # Both must land before it can become blocking. Kept here rather than
      # dropped so the fix is visible when it arrives.
      - name: Acceptance test with known failures (#241, #244)
        continue-on-error: true
        run: |
          python -m pytest -q \
            "tests/test_online_q_acceptance.py::test_simulated_online_q_beats_random_reproducibly"

  # --------------------------------------------------------------- tier 3
  factory-contracts:
    name: factory contracts + hash stability
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (core + dev only)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"
          python -m pip install jsonschema

      - name: Detect Model Factory test modules
        id: detect
        run: |
          if compgen -G "tests/test_model_factory_*.py" > /dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No model factory tests yet — skipping (issues #213-#233)."
          fi

      # The contract hashes are the epic's foundation: a run's identity, its
      # checkpoint compatibility and its A/B validity are all derived from
      # them. Non-deterministic dict ordering leaking into the canonical JSON
      # is the most likely way "reproducible identity" silently stops being
      # reproducible, and it is invisible in any single-seed run. So run the
      # contract suite twice under different hash seeds.
      - name: Contract tests under PYTHONHASHSEED=0
        if: steps.detect.outputs.present == 'true'
        env:
          PYTHONHASHSEED: '0'
        run: python -m pytest tests/test_model_factory_*.py -q

      - name: Contract tests under PYTHONHASHSEED=12345
        if: steps.detect.outputs.present == 'true'
        env:
          PYTHONHASHSEED: '12345'
        run: python -m pytest tests/test_model_factory_*.py -q

      # Artifact schema drift is silent data loss for a provenance system: an
      # older run simply stops being readable and nobody notices until they
      # need it. Golden fixtures + committed schemas make drift a red check.
      #
      # Run when EITHER directory exists, not both. The validator's whole job
      # includes rejecting a schema with no fixture and a fixture with no
      # schema -- requiring both directories would skip validation in exactly
      # the orphan cases it exists to catch, letting the first one merge
      # silently. It already handles a missing counterpart directory: an empty
      # schema glob and an empty fixture glob each exit non-zero.
      - name: Validate artifact schemas against golden fixtures
        run: |
          if [ -d .github/schemas ] || [ -d tests/fixtures/factory ]; then
            python .github/scripts/validate_artifact_schemas.py
          else
            echo "No schemas or fixtures yet — skipping (issue #242)."
          fi

  # --------------------------------------------------------------- tier 4
  neural:
    name: full suite (CPU torch)
    runs-on: ubuntu-latest
    # Non-blocking: this tier is slow (20+ min) and broad enough that a
    # failure here shouldn't hold up a merge. Treat a red run as a bug to
    # triage and fix afterward, not a gate to wait on.
    continue-on-error: true
    # Measured at 44m29s on 4 vCPU (partly under contention). 45 was too
    # tight to be honest about; 75 leaves headroom without letting a hang
    # burn an hour. The single worst test is ~10 min on its own:
    # test_actor_critic_acceptance.py::test_simulated_actor_critic_beats_random_reproducibly.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      # The CPU-only wheel is a fraction of the size of the default CUDA
      # build and dominates install time otherwise.
      - name: Install CPU torch
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install project
        run: python -m pip install -e ".[dev,neural]"

      # --durations keeps runtime creep visible: this tier already measures
      # ~44 min on 4 vCPU, and it should not quietly become 90.
      #
      # The one --deselect is a stale golden that fails on main today (#244):
      # every assertion encoding the acceptance criterion passes, but
      # `training_ticks` drifted 15157 -> 13318 after an episode-termination
      # accounting change. Deselected so this tier reports real signal on the
      # other 1036 tests instead of being red on arrival.
      # TODO: remove with #244 — do not re-baseline the golden to silence it.
      - name: Full test suite
        run: |
          python -m pytest tests -q --durations=25 \
            --deselect "tests/test_online_q_acceptance.py::test_simulated_online_q_beats_random_reproducibly"
