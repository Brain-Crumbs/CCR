name: CI

# Default PR lanes are torch-free, offline and measured together (issue #297).
# The optional CPU-Torch sweep and Factory smoke require manual dispatch.

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'notebooks/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'notebooks/**']
    
  workflow_dispatch:
    inputs:
      legacy_neural:
        description: 'Run the slow legacy CPU-Torch compatibility suite'
        type: boolean
        default: false

# A 20-minute tier must not queue behind superseded pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # `namesgenerator` (a core dependency) ships an sdist with no wheel, and
  # building it against an old/patched setuptools fails with
  # `AttributeError: install_layout`. Every install job upgrades the build
  # frontend first rather than trusting the runner image's default.
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  # --------------------------------------------------------------- tier 1
  core:
    name: core (no torch, py3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (core + dev only, deliberately without torch)
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/python -m pip install --upgrade pip setuptools wheel
          .venv/bin/python -m pip install -e ".[dev]"

      # `ccr nursery list` is deliberately NOT smoke-tested here: it exits 1
      # without torch by design (cli.py:1112). The guard is graceful and
      # intentional, so a core-only install genuinely cannot list scenarios.
      # `ccr nursery --help` still exercises the nested subparser wiring
      # because argparse renders help without dispatching to the command.
      - name: CLI smoke
        run: |
          python -c "import cognitive_runtime.cli"
          ccr --help > /dev/null
          ccr nursery --help > /dev/null
          ccr trace list > /dev/null

      # Regression guard for issue #241: importing `motor` must not import
      # the optional neural dependency, so collection is a blocking core-only
      # check rather than an advisory signal.
      - name: Test collection must succeed without torch
        run: sudo -E unshare --net -- "$(command -v python)" .github/scripts/run_core_tests.py --collect-only --report /tmp/core-collection.json

      - name: Torch-free unit tests (including Factory seed 0)
        run: |
          sudo -E unshare --net -- "$(command -v python)" .github/scripts/run_core_tests.py --report /tmp/core-tests.json

      - name: Upload core runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-runtime
          path: /tmp/core-*.json
          if-no-files-found: error
          retention-days: 7

  # --------------------------------------------------------------- tier 2
  factory-contracts:
    name: factory contracts + hash stability
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (core + dev only)
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/python -m pip install --upgrade pip setuptools wheel
          .venv/bin/python -m pip install -e ".[dev]"

      # The complete core suite already runs every Factory test under seed 0.
      # This second seed preserves hash-order coverage without a third copy.
      - name: Contract tests under PYTHONHASHSEED=12345
        env:
          PYTHONHASHSEED: '12345'
        run: sudo -E unshare --net -- "$(command -v python)" .github/scripts/run_core_tests.py tests/test_model_factory_*.py --report /tmp/contracts-seed-12345.json

      - name: Validate artifact schemas against golden fixtures
        run: python .github/scripts/validate_artifact_schemas.py

      - name: Upload contract runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contracts-runtime
          path: /tmp/contracts-seed-*.json
          if-no-files-found: error
          retention-days: 7

  aggregate-core-budget:
    name: aggregate offline core budget
    needs: [core, factory-contracts]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-runtime'
          merge-multiple: true
          path: /tmp/core-runtime
      - name: Enforce aggregate 120-second execution target
        run: python .github/scripts/check_core_budget.py /tmp/core-runtime

  # --------------------------------------------------------------- tier 4
  neural:
    name: full suite (CPU torch)
    # Pull requests run the fast core and Model Factory contract lanes. The
    # expensive compatibility/CPU-Torch sweep is manual/opt-in only.
    if: github.event_name == 'workflow_dispatch' && inputs.legacy_neural
    runs-on: ubuntu-latest
    # Non-blocking: this tier is slow (20+ min) and broad enough that a
    # failure here shouldn't hold up a merge. Treat a red run as a bug to
    # triage and fix afterward, not a gate to wait on.
    continue-on-error: true
    # Measured at 44m29s on 4 vCPU (partly under contention). 45 was too
    # tight to be honest about; 75 leaves headroom without letting a hang
    # burn an hour. The single worst test is ~10 min on its own:
    # test_actor_critic_acceptance.py::test_simulated_actor_critic_beats_random_reproducibly.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      # The CPU-only wheel is a fraction of the size of the default CUDA
      # build and dominates install time otherwise.
      - name: Install CPU torch
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install project
        run: python -m pip install -e ".[dev,neural]"

      # --durations keeps runtime creep visible: this tier already measures
      # ~44 min on 4 vCPU, and it should not quietly become 90.
      - name: Full test suite
        run: python -m pytest tests -q --durations=25 --run-market=extended
